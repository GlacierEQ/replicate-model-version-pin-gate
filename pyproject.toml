[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "replicate-model-version-pin-gate"
version = "1.1.0"
description = "Immutable model-version pinning and content-addressed lockfiles for reproducible inference"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
model-version-pin = "model_version_pin_gate:cli"

[tool.setuptools]
py-modules = ["model_version_pin_gate"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
